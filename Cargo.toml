[package]
name = "open-arrow-web-crawl"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
open-arrow-access = { version = "0.21.2", features = ["decompression-gzip", "format-warc", "service-warc", "service-pmc", "service-semantic-scholar", "service-arxiv", "service-bhl"] }
open-arrow-sink = { version = "0.6.4", features = ["sink-lance"] }
futures = "0.3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "common_crawl"
path = "src/common_crawl/main.rs"

[[bin]]
name = "pmc"
path = "src/pmc/main.rs"

[[bin]]
name = "s2orc"
path = "src/s2orc/main.rs"

[[bin]]
name = "arxiv"
path = "src/arxiv/main.rs"

[[bin]]
name = "bhl"
path = "src/bhl/main.rs"

[[bin]]
name = "arxiv-duckdb"
path = "src/arxiv-duckdb/main.rs"
